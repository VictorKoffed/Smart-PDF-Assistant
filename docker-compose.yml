version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL}
